name: Deploy SchoolTouch landing page

on:
  push:
    branches: [main]
    paths:
      - "schoolTouch-html-css/**"
      - ".github/workflows/deploy-schooltouch-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "schooltouch-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the SchoolTouch HTML/CSS folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: schoolTouch-html-css

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
